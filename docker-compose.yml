version: "3.8"

services:

  # ── MiniStack（LocalStack代替・MIT・認証不要） ──────────
  ministack:
    image: ministackorg/ministack:latest
    container_name: sensor-ministack
    ports:
      - "4566:4566"
    environment:
      - PERSIST_STATE=1                          # DynamoDBデータを永続化
      - STATE_DIR=/data/ministack-state          # 永続化パス
    volumes:
      - ministack-data:/data                     # DynamoDBデータの永続化
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Express API ────────────────────────────────────────
  api:
    build: ./api
    container_name: sensor-api
    ports:
      - "3000:3000"
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=ap-northeast-1
      - DYNAMODB_ENDPOINT=http://ministack:4566
      - TABLE_NAME=SensorData
    volumes:
      - api-logs:/app/logs                       # APIログの永続化
    depends_on:
      ministack:
        condition: service_healthy               # MiniStack が Ready になってから起動
    restart: unless-stopped

  # ── Node-RED ───────────────────────────────────────────
  nodered:
    build: ./node-red
    container_name: sensor-nodered
    ports:
      - "1880:1880"
    volumes:
      - nodered-data:/data                       # フロー・設定・追加ノードの永続化
    depends_on:
      - api
    restart: unless-stopped

volumes:
  ministack-data:
    name: sensor-ministack-data                  # DynamoDBデータ（MiniStack）
  api-logs:
    name: sensor-api-logs                        # APIログ
  nodered-data:
    name: sensor-nodered-data                    # Node-REDフロー・設定

networks:
  default:
    name: sensor-network
